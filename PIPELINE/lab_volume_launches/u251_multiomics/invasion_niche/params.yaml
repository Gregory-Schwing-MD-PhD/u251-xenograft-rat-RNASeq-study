host_r2_splits: /rs/rs_grp_oschome/go2432/u251_host/verify/results/r2_relabel_splits.tsv
xengsort_dir: /wsu/home/go/go24/go2432/u251-xenograft-murine-RNASeq-study/ANALYSIS/xengsort_out
index_seq_dir: /rs/rs_grp_oschome/go2432/u251_multiomics/reads/index_seq
