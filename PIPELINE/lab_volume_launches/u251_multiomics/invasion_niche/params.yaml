# invasion_niche parameters. Flat YAML (one key per line, lists comma-separated) so that base R can read it
# (bin/inv_common.R read_params) inside either container. Every non-default choice is explained in README.md.
# U = grid clone of the repository, H = host (rat) analyses, M = multi-omics build root.

outdir: /rs/rs_grp_oschome/go2432/u251_multiomics/invasion_niche/results

# ---- inputs (read only)
graft_counts: /rs/rs_grp_oschome/go2432/u251_multiomics/rnaseq_graft/results/star_salmon/salmon.merged.gene_counts.tsv
graft_picard_dir: /rs/rs_grp_oschome/go2432/u251_multiomics/rnaseq_graft/results/star_salmon/picard_metrics
graft_checks: /rs/rs_grp_oschome/go2432/u251_multiomics/rnaseq_graft/checks.json
pub_counts: /wsu/home/go/go24/go2432/u251-xenograft-murine-RNASeq-study/ANALYSIS/results_human_final/star_salmon/salmon.merged.gene_counts.tsv
human_gtf: /wsu/home/go/go24/go2432/u251-xenograft-murine-RNASeq-study/ANALYSIS/refs/human/GRCh38.primary_assembly.annotation.gtf.gz
rat_gtf: /rs/rs_grp_oschome/go2432/u251_host/results_rnaseq/genome/Rattus_norvegicus.mRatBN7.2.110.filtered.gtf
host_counts: /rs/rs_grp_oschome/go2432/u251_host/results_rnaseq/star_salmon/salmon.merged.gene_counts.tsv
host_fits_dir: /rs/rs_grp_oschome/go2432/u251_host/verify/results/fits
