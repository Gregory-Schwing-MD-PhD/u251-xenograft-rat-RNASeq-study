# human_de_null settings. run.sbatch reads these (flat `key: value`, no quotes, no nesting, no '#' inside a value) and
# passes them to the two R scripts as key=value arguments. README.md says why each value is what it is.
# Fixed in bin/human_de_null_de.R, because they are the pipeline's DESEQ2_DIFFERENTIAL settings and R0 tests them:
#   design ~ 0 + Classification; salmon gene lengths as avgTxLength; Wald test, fitType parametric, sfType ratio,
#   minReplicatesForReplace 99, useT FALSE, minmu 0.5, lfcThreshold 0, altHypothesis greaterAbs, independent
#   filtering, BH. p and padj come from the unshrunk test; the table's log2FoldChange is lfcShrink(type ashr).

# ---- inputs, pass A (the analysis of record: the published graft+both counts)
passA_counts: /wsu/home/go/go24/go2432/u251-xenograft-murine-RNASeq-study/ANALYSIS/results_human_final/star_salmon/salmon.merged.gene_counts.tsv
passA_lengths: /wsu/home/go/go24/go2432/u251-xenograft-murine-RNASeq-study/ANALYSIS/results_human_final/star_salmon/salmon.merged.gene_lengths.tsv

# ---- inputs, pass B (pre-registered rat-leak sensitivity: graft-only counts from rnaseq_graft, columns <lib>_graft)
passB_counts: /rs/rs_grp_oschome/go2432/u251_multiomics/rnaseq_graft/results/star_salmon/salmon.merged.gene_counts.tsv
passB_lengths: /rs/rs_grp_oschome/go2432/u251_multiomics/rnaseq_graft/results/star_salmon/salmon.merged.gene_lengths.tsv
passB_required_checks: 0,1,2,3,4,10

