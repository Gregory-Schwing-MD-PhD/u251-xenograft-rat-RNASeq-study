published_table: /wsu/home/go/go24/go2432/u251-xenograft-murine-RNASeq-study/ANALYSIS/results_therapy_v3/tables/differential/therapy_impact.deseq2.results.tsv
published_filtered: /wsu/home/go/go24/go2432/u251-xenograft-murine-RNASeq-study/ANALYSIS/results_therapy_v3/tables/differential/therapy_impact.deseq2.results_filtered.tsv
