tpm_published: /wsu/home/go/go24/go2432/u251-xenograft-murine-RNASeq-study/ANALYSIS/results_human_final/star_salmon/salmon.merged.gene_tpm.tsv
fastqc_raw: /wsu/home/go/go24/go2432/u251-xenograft-murine-RNASeq-study/ANALYSIS/results_human_final/multiqc/star_salmon/multiqc_report_data/multiqc_fastqc_fastqc_raw.txt

# ---------------------------------------------------------------- graft-only sensitivity rerun (IRP_MODE=graft)
counts_graft: /rs/rs_grp_oschome/go2432/u251_multiomics/rnaseq_graft/results/star_salmon/salmon.merged.gene_counts.tsv
tpm_graft: /rs/rs_grp_oschome/go2432/u251_multiomics/rnaseq_graft/results/star_salmon/salmon.merged.gene_tpm.tsv
graft_checks: /rs/rs_grp_oschome/go2432/u251_multiomics/rnaseq_graft/checks.json
graft_suffix: _graft
graft_max_deferrals: 8

# ---------------------------------------------------------------- item 1: calibrated human share
libraries: C2B,IL64B,IL66B,IL67B,IL68B,IL69B,N168B,N269B,NL70B,NL71B
expected_total_pairs: 822628276
human_calibrator: C2B
rat_calibrators: IL64B,N168B
# Groups (ANALYSIS/SAMPLE_KEY.md): used only to label rows; nothing here compares the groups.
group_primary: IL67B,IL68B,IL69B
group_recurrent: IL66B,NL70B,NL71B
# Rates stated in the spec (SELECTION S8). The job computes them from the xengsort logs and refuses to run unless each
# computed rate rounds to the stated value (4 decimals: +-0.00005; 3 decimals: +-0.0005).
stated_human_graft: 0.8619
stated_human_both: 0.1124
stated_human_host: 0.0046
stated_rat_host: 0.9359,0.9357
stated_rat_graft: 0.0033,0.0055
stated_rat_both: 0.047,0.051
h_agree_tol: 0.03

# ---------------------------------------------------------------- item 2: rat reads per gene
rat_leak_mark: 0.1
leak_min_count_selfcheck: 20

# ---------------------------------------------------------------- item 3: MGMT and CDKN2A/CDKN2B loci
locus_targets: MGMT,CDKN2A,CDKN2B
posctrl_tpm_lo: 1
posctrl_tpm_hi: 5
posctrl_n: 2
mapq_unique: 255
sam_exclude_flags: 0x904
poisson_ub_level: 0.95

# ---------------------------------------------------------------- items 5 and 6: DepMap arms and identity
tpm_min: 1
arm_min_genes: 20
identity_top_var_genes: 5000
depmap_lineage: CNS/Brain
depmap_family: ACH-000232,ACH-001172,ACH-001198
depmap_family_names: U251MG,U251MGDM,SNB19
depmap_mgmt_posctrl: T98G
# All histone genes (replication-dependent and replacement), the same rule as rnaseq_graft check 8. DepMap is poly(A)
# RNA and Pico v2 is total RNA; replication-dependent histone mRNAs carry no poly(A) tail.
histone_regex: ^(H1-[0-9]+|H2A[CJWXZ][0-9A-Z]*|H2B[CUW][0-9A-Z]*|H3C[0-9]+|H3-[0-9][0-9A-Z]*|H4C[0-9]+|H4-16)$
rrbs_loci_prefixes: MGMT_,CDKN2A_,CDKN2B_,GAPDH_

