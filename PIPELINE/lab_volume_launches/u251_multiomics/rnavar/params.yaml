# rnavar: nf-core/rnavar 1.3.0 on the graft-only U251 reads (R2 clipped once, upstream, by prep_reads).
# Every line below that is not a pipeline default is explained in README.md. The reference paths are the contract
# written by stage_refs (M/stage_refs/params.yaml); the head job gates on M/refs/.done/{gencode,known_sites,vep}.
input:  "/rs/rs_grp_oschome/go2432/u251_multiomics/rnavar/samplesheet.csv"
outdir: "/rs/rs_grp_oschome/go2432/u251_multiomics/rnavar/results"

# No iGenomes. The default genome 'GRCh38' is an iGenomes key whose entry carries no dbSNP, and main.nf fills
# dbsnp/known_indels/vep_* from getGenomeAttribute() when a genome key is set. Everything is given explicitly instead.
genome: null
igenomes_ignore: true

# GENCODE v44 (Ensembl 110) GRCh38 primary assembly: the release of the published human run, unzipped by stage_refs
fasta:     "/rs/rs_grp_oschome/go2432/u251_multiomics/refs/gencode_v44/GRCh38.primary_assembly.genome.fa"
fasta_fai: "/rs/rs_grp_oschome/go2432/u251_multiomics/refs/gencode_v44/GRCh38.primary_assembly.genome.fa.fai"
gtf:       "/rs/rs_grp_oschome/go2432/u251_multiomics/refs/gencode_v44/GRCh38.primary_assembly.annotation.gtf"

# STAR: index built in the run with sjdbOverhang = read_length - 1 = 100 (R1 35-101 nt, clipped R2 32-98 nt)
read_length: 101
save_reference: true          # keep the STAR index, dict and exon BED (results/genome)
star_twopass: true            # the default, written out: --twopassMode Basic

# GATK known sites: Broad hg38 bundle cut to chr1-22,X,Y,M, ##contig lines rebuilt from the GENCODE fai
dbsnp:            "/rs/rs_grp_oschome/go2432/u251_multiomics/refs/known_sites/dbsnp138.primary.vcf.gz"
dbsnp_tbi:        "/rs/rs_grp_oschome/go2432/u251_multiomics/refs/known_sites/dbsnp138.primary.vcf.gz.tbi"
known_indels:     "/rs/rs_grp_oschome/go2432/u251_multiomics/refs/known_sites/mills_1000g.primary.vcf.gz"
known_indels_tbi: "/rs/rs_grp_oschome/go2432/u251_multiomics/refs/known_sites/mills_1000g.primary.vcf.gz.tbi"

# 'tools' ADDS to the defaults (defineToolsList, utils_nfcore_rnavar_pipeline l.339-377): baserecalibrator,
# intervallisttools, multiqc, removeunknownregions and variantfiltration all stay on.
tools: "seq2hla,vep"

# VEP 115 on the local indexed cache (layout <vep_cache>/homo_sapiens/115_GRCh38), no download
vep_cache: "/rs/rs_grp_oschome/go2432/u251_multiomics/refs/vep_cache"
vep_cache_version: 115
vep_genome: "GRCh38"
vep_species: "homo_sapiens"
vep_include_fasta: true       # --fasta: offline HGVS needs the reference sequence
# The default is "--everything --filter_common --per_gene --total_length --offline --format vcf".
#   --filter_common would drop every variant common in gnomAD, i.e. every heterozygous germline SNP the arm-level
#     allelic-imbalance step needs; --per_gene would keep one transcript per gene, so the TP53 match on
#     ENSP00000269305 could miss. Both removed. --allele_number added: CSQ then carries ALLELE_NUM, so each
#     consequence is tied to its ALT without re-deriving VEP's allele trimming.
vep_custom_args: "--everything --total_length --offline --format vcf --allele_number"
# snpEff is NOT run ('snpeff' is not in tools). This value only exists because VCF_ANNOTATE_ALL wires
# VCF_ANNOTATE_SNPEFF even when snpEff is off, and with igenomes_ignore the parameter would be null, which stops the
# run at DAG construction ("A process input channel evaluates to null -- Invalid declaration `val db`"; found by a
# local -stub-run of 1.3.0). GRCh38.99 is the pipeline's own iGenomes value for GRCh38 (conf/igenomes.config l.30).
snpeff_db: "GRCh38.99"

generate_gvcf: false          # the default, written out: per-sample VCFs; sites are force-counted afterwards
seq_platform: "illumina"      # the default, written out: RG PL tag, which GATK requires

multiqc_title: "U251N LITT rnavar 1.3.0 graft-only"
